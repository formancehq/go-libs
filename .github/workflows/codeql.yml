name: CodeQL
on:
  push:
    branches: [ "main", "release/*", "releases/*" ]
  pull_request:
    branches: [ "main", "release/*", "releases/*" ]
  schedule:
    - cron: '38 16 * * 3'

jobs:
  CodeQL:
    uses: formancehq/ci/.github/workflows/go-codeql.yml@v1
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
